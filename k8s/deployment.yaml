apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-python-app

  template:
    metadata:
      labels:
        app: cicd-python-app

    spec:
      containers:
        - name: cicd-python-app
          image: 691914216603.dkr.ecr.us-east-1.amazonaws.com/cicd-python-app:9e5c87a62d075fbcf0abb03836160b98841872fe
          ports:
            - containerPort: 5000