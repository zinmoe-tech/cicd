apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-python-app

  template:
    metadata:
      labels:
        app: cicd-python-app

    spec:
      containers:
        - name: cicd-python-app
          image: 691914216603.dkr.ecr.us-east-1.amazonaws.com/cicd-python-app:c6aa4ea442c938368af03d6684081b1fbed6f712
          ports:
            - containerPort: 5000