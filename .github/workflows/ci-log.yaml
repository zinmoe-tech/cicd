name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          pytest python-code/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions

      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

          echo "Configured AWS region:"
          echo "$AWS_REGION"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Show Docker images
        run: |
          docker images

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Pushing image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Show pushed image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Successfully pushed:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name cicd-eks-cluster \
            --region ap-southeast-1

      - name: Check EKS connection
        run: |
          echo "Current Kubernetes context:"
          kubectl config current-context

          echo "Cluster nodes:"
          kubectl get nodes

          echo "Existing deployments:"
          kubectl get deployments -A

      - name: Deploy application to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Deploying image:"
          echo "$IMAGE_URI"

          sed "s|IMAGE_URI|$IMAGE_URI|g" \
            k8s/deployment.yaml | kubectl apply -f -

      - name: Apply Kubernetes Service
        run: |
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cicd-python-app \
            --timeout=180s

      - name: Verify deployed image
        run: |
          echo "Image currently configured in EKS:"

          kubectl get deployment cicd-python-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Show Kubernetes resources
        run: |
          echo "Deployment:"
          kubectl get deployment cicd-python-app

          echo "Pods:"
          kubectl get pods \
            -l app=cicd-python-app \
            -o wide

          echo "Service:"
          kubectl get svc cicd-python-service